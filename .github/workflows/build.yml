name: Build OP-TEE FVP + TFTF Attack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acpica-tools bc bison build-essential curl flex git libglib2.0-dev libpixman-1-dev libssl-dev python3-pip python3-pyelftools python3-serial device-tree-compiler

      - name: Sync OP-TEE Manifest
        run: |
          mkdir -p $GITHUB_WORKSPACE/optee-fvp
          cd $GITHUB_WORKSPACE/optee-fvp
          repo init -u https://github.com/OP-TEE/manifest.git -m fvp.xml
          repo sync -j$(nproc)

      - name: Build OP-TEE FVP
        run: |
          cd $GITHUB_WORKSPACE/optee-fvp/build
          make -j$(nproc) toolchains
          make -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/artifacts/binaries /tmp/artifacts/debug /tmp/artifacts/logs
          WS=$GITHUB_WORKSPACE/optee-fvp
          TFTF=$WS/trusted-firmware-a-tests

          BL1=$(find $WS -name "bl1.bin" | grep -v "\.o" | head -1)
          FIP=$(find $WS -name "fip.bin" | grep -v "\.o\|tftf" | head -1)
          IMG=$(find $WS -name "boot-fat.uefi.img" | head -1)
          TFTF_BIN=$(find $TFTF -name "tftf.bin" 2>/dev/null | head -1)

          [ -n "$BL1" ]      && cp $BL1      /tmp/artifacts/binaries/bl1.bin
          [ -n "$FIP" ]      && cp $FIP      /tmp/artifacts/binaries/fip.bin
          [ -n "$IMG" ]      && cp $IMG      /tmp/artifacts/binaries/boot-fat.uefi.img
          [ -n "$TFTF_BIN" ] && cp $TFTF_BIN /tmp/artifacts/binaries/tftf.bin

          find $WS/trusted-firmware-a -name "*.elf" -o -name "*.map" 2>/dev/null | xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true
          find $WS/optee_os -name "tee.elf" 2>/dev/null | xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: optee-binaries
          path: /tmp/artifacts/binaries/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: optee-debug
          path: /tmp/artifacts/debug/
