name: Build OP-TEE FVP + TFTF Attack

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            repo git curl wget python3 python3-pip \
            make cmake ninja-build pkg-config \
            libssl-dev libglib2.0-dev libpixman-1-dev \
            device-tree-compiler bc bison flex \
            dosfstools mtools cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # Cache toolchains (mesma key - nao invalida o existente)
      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: optee-fvp/toolchains
          key: ${{ runner.os }}-optee-toolchains-v1

      # Cache sources (separado para nao misturar)
      - name: Cache Sources
        id: cache-sources
        uses: actions/cache@v4
        with:
          path: optee-fvp/sources
          key: ${{ runner.os }}-optee-sources-v2

      - name: Sync OP-TEE Manifest
        run: |
          mkdir -p optee-fvp
          cd optee-fvp
          repo init -u https://github.com/OP-TEE/manifest.git -m fvp.xml
          repo sync -j$(nproc) --no-clone-bundle

      - name: Download toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          cd optee-fvp/build
          make -f fvp.mk toolchains

      # Build principal: OP-TEE + TF-A + Linux
      # CFG_SECURE_PARTITION=y: traz helpers FF-A de memoria no OP-TEE
      # CFG_CORE_SEL1_SPMC=y:   SPMC em S-EL1 (OP-TEE)
      # DEBUG=1 no TF-A e OP-TEE: gera ELF/MAP sem quebrar testes
      - name: Build OP-TEE FVP
        run: |
          cd optee-fvp/build
          make -f fvp.mk all \
            SPMC_AT_EL=1 \
            CFG_SECURE_PARTITION=y \
            DEBUG=1 \
            -j$(nproc) \
            2>&1 | tee /tmp/build_optee.log

      # Injetar nosso teste no TFTF
      - name: Inject test sources into TFTF
        run: |
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests
          FRAG=$TFTF/tftf/tests/runtime_services/secure_service/ffa_frag_mismatch
          TEST_SRC=$GITHUB_WORKSPACE/tftf-tests

          mkdir -p "$FRAG"

          # Copiar nosso arquivo de teste
          cp "$TEST_SRC/test_op_tee_oob_claude.c" "$FRAG/"

          # Copiar mk e xml (define o test suite op-tee-oob)
          cp "$TEST_SRC/tests-op-tee-oob.mk" "$TFTF/tftf/tests/"
          cp "$TEST_SRC/tests-op-tee-oob.xml" "$TFTF/tftf/tests/"

      # Build TFTF
      - name: Build TFTF
        run: |
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests
          CROSS=$(ls "$GITHUB_WORKSPACE"/optee-fvp/toolchains/aarch64/bin/aarch64-*-gcc \
                  | head -1 | sed 's/gcc$//')

          cd "$TFTF"
          make \
            CROSS_COMPILE="$CROSS" \
            PLAT=fvp \
            DEBUG=1 \
            TESTS=op-tee-oob \
            -j$(nproc) \
            2>&1 | tee /tmp/build_tftf.log

      - name: Locate TFTF binary
        if: always()
        run: |
          echo "=== Procurando tftf.bin em toda a arvore ==="
          find "$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests" -iname "tftf.bin" -print

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-binaries
          path: |
            optee-fvp/trusted-firmware-a/build/fvp/release/bl1.bin
            optee-fvp/trusted-firmware-a/build/fvp/release/fip.bin
            optee-fvp/out/boot-fat.uefi.img
            optee-fvp/out/boot.scr
            optee-fvp/out-br/images/rootfs.cpio.gz
            optee-fvp/linux/arch/arm64/boot/Image
            optee-fvp/linux/arch/arm64/boot/dts/arm/fvp-base-revc.dtb
            optee-fvp/trusted-firmware-a-tests/build/fvp/debug/tftf.bin
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-logs
          path: |
            /tmp/build_optee.log
            /tmp/build_tftf.log
          if-no-files-found: warn
