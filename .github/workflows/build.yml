name: Build OP-TEE FVP + TFTF PoCs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        test: [poc1, poc2, poc3, poc4]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            repo git curl wget python3 python3-pip \
            make cmake ninja-build pkg-config \
            libssl-dev libglib2.0-dev libpixman-1-dev \
            device-tree-compiler bc bison flex \
            dosfstools mtools cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: optee-fvp/toolchains
          key: ${{ runner.os }}-optee-toolchains-v1

      - name: Cache Sources
        id: cache-sources
        uses: actions/cache@v4
        with:
          path: optee-fvp/sources
          key: ${{ runner.os }}-optee-sources-v2

      - name: Sync OP-TEE Manifest
        run: |
          mkdir -p optee-fvp
          cd optee-fvp
          repo init -u https://github.com/OP-TEE/manifest.git -m fvp.xml
          repo sync -j$(nproc) --no-clone-bundle

      - name: Clone TF-A Tests
        run: |
          cd optee-fvp

          if [ ! -d trusted-firmware-a-tests ]; then
            git clone --depth 1 \
              https://github.com/TrustedFirmware-A/tf-a-tests.git \
              trusted-firmware-a-tests
          fi

          echo "=== TF-A Tests ==="
          git -C trusted-firmware-a-tests rev-parse --short HEAD

      - name: Download toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          cd optee-fvp/build
          make -f fvp.mk toolchains

      - name: Build OP-TEE FVP
        run: |
          cd optee-fvp/build

          make -f fvp.mk all \
            SPMC_AT_EL=1 \
            CFG_SECURE_PARTITION=y \
            DEBUG=1 \
            -j$(nproc) \
            2>&1 | tee /tmp/build_optee.log

      - name: Inject test sources into TFTF
        run: |
          TFTF="$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests"
          TEST_SRC="$GITHUB_WORKSPACE/tftf-tests"
          TEST_NAME="${{ matrix.test }}"

          FRAG="$TFTF/tftf/tests/runtime_services/secure_service/$TEST_NAME"

          mkdir -p "$FRAG"

          cp "$TEST_SRC/$TEST_NAME.c" "$FRAG/"
          cp "$TEST_SRC/tests-$TEST_NAME.mk" "$TFTF/tftf/tests/"
          cp "$TEST_SRC/tests-$TEST_NAME.xml" "$TFTF/tftf/tests/"

          echo "=== Arquivos injetados ($TEST_NAME) ==="
          find "$FRAG" -maxdepth 1 -type f -print
          ls -l "$TFTF/tftf/tests/"*$TEST_NAME*

      - name: Register TFTF test suite
        run: |
          TFTF="$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests"
          TEST_NAME="${{ matrix.test }}"

          echo "=== Procurando mecanismo de registro dos testes ==="

          grep -Rni \
            "TESTS.*xml\|tests.*xml\|tests-$TEST_NAME" \
            "$TFTF/tftf" \
            "$TFTF/Makefile" \
            "$TFTF/make_helpers" \
            2>/dev/null | head -100 || true

      - name: Build TFTF
        run: |
          TFTF="$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests"
          TEST_NAME="${{ matrix.test }}"

          CROSS=$(find "$GITHUB_WORKSPACE/optee-fvp/toolchains/aarch64/bin" \
            -type f -name 'aarch64-*-gcc' \
            -print -quit | sed 's/gcc$//')

          if [ -z "$CROSS" ]; then
            echo "ERRO: cross compiler não encontrado"
            find "$GITHUB_WORKSPACE/optee-fvp/toolchains" \
              -type f -name '*gcc' | head -30
            exit 1
          fi

          echo "CROSS_COMPILE=$CROSS"

          cd "$TFTF"

          make \
            CROSS_COMPILE="$CROSS" \
            PLAT=fvp \
            DEBUG=1 \
            TESTS=$TEST_NAME \
            -j$(nproc) \
            2>&1 | tee /tmp/build_tftf.log

      - name: Locate TFTF binary
        if: always()
        run: |
          echo "=== Procurando tftf.bin ==="

          find "$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests" \
            -type f \
            -name "tftf.bin" \
            -print

      - name: Rebuild TF-A FIP with TFTF as BL33
        run: |
          TFTF="$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests/build/fvp/debug/tftf.bin"
          TFA="$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a"
          TEST_NAME="${{ matrix.test }}"

          CROSS=$(find "$GITHUB_WORKSPACE/optee-fvp/toolchains/aarch64/bin" \
            -type f -name 'aarch64-*-gcc' \
            -print -quit | sed 's/gcc$//')

          if [ ! -f "$TFTF" ]; then
            echo "ERRO: TFTF não encontrado:"
            echo "$TFTF"
            exit 1
          fi

          if [ -z "$CROSS" ]; then
            echo "ERRO: cross compiler não encontrado para o rebuild do FIP"
            find "$GITHUB_WORKSPACE/optee-fvp/toolchains" \
              -type f -name '*gcc' | head -30
            exit 1
          fi

          echo "=== TFTF ==="
          ls -lh "$TFTF"

          echo "=== CROSS_COMPILE ==="
          echo "$CROSS"

          cd "$TFA"

          make \
            CROSS_COMPILE="$CROSS" \
            PLAT=fvp \
            DEBUG=1 \
            BL33="$TFTF" \
            fip \
            2>&1 | tee /tmp/build_fip_tftf.log

      - name: Verify final images
        if: always()
        run: |
          echo "=== BL31 ==="
          find "$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a" \
            -name "bl31.bin" -print

          echo "=== FIP ==="
          find "$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a" \
            -name "fip.bin" -print

          echo "=== TFTF ==="
          find "$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests" \
            -name "tftf.bin" -print

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-binaries-${{ matrix.test }}
          path: |
            optee-fvp/trusted-firmware-a/build/fvp/debug/bl1.bin
            optee-fvp/trusted-firmware-a/build/fvp/debug/bl2.bin
            optee-fvp/trusted-firmware-a/build/fvp/debug/bl31.bin
            optee-fvp/trusted-firmware-a/build/fvp/debug/fip.bin
            optee-fvp/out/boot-fat.uefi.img
            optee-fvp/out/boot.scr
            optee-fvp/out-br/images/rootfs.cpio.gz
            optee-fvp/linux/arch/arm64/boot/Image
            optee-fvp/linux/arch/arm64/boot/dts/arm/fvp-base-revc.dtb
            optee-fvp/trusted-firmware-a-tests/build/fvp/debug/tftf.bin
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-logs-${{ matrix.test }}
          path: |
            /tmp/build_optee.log
            /tmp/build_tftf.log
            /tmp/build_fip_tftf.log
          if-no-files-found: error
