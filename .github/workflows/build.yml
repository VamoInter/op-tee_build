name: Build OP-TEE FVP + TFTF Attack

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            repo git curl wget python3 python3-pip \
            make cmake ninja-build pkg-config \
            libssl-dev libglib2.0-dev libpixman-1-dev \
            device-tree-compiler bc bison flex \
            dosfstools mtools cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # ── Cache toolchains (mesma key — não invalida o existente) ──
      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: optee-fvp/toolchains
          key: ${{ runner.os }}-optee-toolchains-v1

      # ── Cache sources (separado para não misturar) ──
      - name: Cache Sources
        id: cache-sources
        uses: actions/cache@v4
        with:
          path: optee-fvp/sources
          key: ${{ runner.os }}-optee-sources-v2

      - name: Sync OP-TEE Manifest
        run: |
          mkdir -p optee-fvp
          cd optee-fvp
          repo init -u https://github.com/OP-TEE/manifest.git -m fvp.xml
          repo sync -j$(nproc) --no-clone-bundle

      - name: Download toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          cd optee-fvp/build
          make -f fvp.mk toolchains

      # ── Build principal: OP-TEE + TF-A + Linux ──
      # CFG_SECURE_PARTITION=y: traz helpers FF-A de memória no OP-TEE
      # CFG_CORE_SEL1_SPMC=y:   SPMC em S-EL1 (OP-TEE)
      # DEBUG=1 no TF-A e OP-TEE: gera ELF/MAP sem quebrar testes
      - name: Build OP-TEE FVP
        run: |
          cd optee-fvp/build
          make -f fvp.mk all \
            SPMC_AT_EL=1 \
            CFG_SECURE_PARTITION=y \
            DEBUG=1 \
            -j$(nproc) \
            2>&1 | tee /tmp/build_optee.log

      # ── Injetar nosso teste no TFTF ──
      - name: Inject test sources into TFTF
        run: |
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests
          FRAG=$TFTF/tftf/tests/runtime_services/secure_service/ffa_frag_mismatch
          TEST_SRC=$GITHUB_WORKSPACE/tftf-tests

          mkdir -p $FRAG

          # Copiar nosso arquivo de teste
          cp $TEST_SRC/test_op_tee_oob_claude.c $FRAG/

          # Copiar mk e xml (define o test suite op-tee-oob)
          cp $TEST_SRC/tests-op-tee-oob.mk $TFTF/tftf/tests/
          cp $TEST_SRC/tests-op-tee-oob.xml $TFTF/tftf/tests/

      # ── Build TFTF ──
      - name: Build TFTF
        run: |
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests
          CROSS=$(ls $GITHUB_WORKSPACE/optee-fvp/toolchains/aarch64/bin/aarch64-*-gcc \
                  | head -1 | sed 's/gcc$//')

          cd $TFTF
          make \
            CROSS_COMPILE=$CROSS \
            PLAT=fvp \
            DEBUG=1 \
            TESTS=op-tee-oob \
            -j$(nproc) \
            2>&1 | tee /tmp/build_tftf.log

      # ── Montar fip_tftf.bin ──
      - name: Package fip_tftf.bin
        run: |
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests
          TFA=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a
          FIP=$TFA/build/fvp/release
          FIPTOOL=$TFA/tools/fiptool/fiptool

          # Extrair componentes do fip.bin original
          mkdir -p /tmp/fip_parts
          $FIPTOOL unpack $FIP/fip.bin --out /tmp/fip_parts --force

          # Criar fip_tftf.bin com TFTF como BL33
          $FIPTOOL create \
            --tb-fw           /tmp/fip_parts/bl2.bin \
            --tb-fw-config    /tmp/fip_parts/tb-fw-config.dtb \
            --soc-fw          /tmp/fip_parts/bl31.bin \
            --soc-fw-config   /tmp/fip_parts/soc-fw-config.dtb \
            --tos-fw          /tmp/fip_parts/bl32.bin \
            --tos-fw-config   /tmp/fip_parts/tos-fw-config.dtb \
            --nt-fw           $TFTF/build/fvp/debug/tftf.bin \
            --nt-fw-config    /tmp/fip_parts/nt-fw-config.dtb \
            --hw-config       /tmp/fip_parts/hw-config.dtb \
            --fw-config       /tmp/fip_parts/fw-config.dtb \
            /tmp/fip_tftf.bin

          echo "fip_tftf.bin: $(stat -c%s /tmp/fip_tftf.bin) bytes"

      # ── Coletar todos os artefatos ──
      - name: Collect artifacts
        run: |
          mkdir -p /tmp/artifacts/binaries
          mkdir -p /tmp/artifacts/debug
          mkdir -p /tmp/artifacts/logs

          TFA=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests

          # Binários principais
          cp $TFA/build/fvp/release/bl1.bin     /tmp/artifacts/binaries/
          cp $TFA/build/fvp/release/fip.bin     /tmp/artifacts/binaries/
          cp /tmp/fip_tftf.bin                  /tmp/artifacts/binaries/
          cp $GITHUB_WORKSPACE/optee-fvp/out/boot-fat.uefi.img \
                                                /tmp/artifacts/binaries/ 2>/dev/null || true

          # Debug: ELF e MAP
          find $TFA/build/fvp/release -name "*.elf" -o -name "*.map" | \
            xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true
          find $TFTF/build/fvp/debug -name "*.elf" -o -name "*.map" | \
            xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true

          # OP-TEE ELF (para símbolos no Iris)
          find $GITHUB_WORKSPACE/optee-fvp -name "tee.elf" | \
            xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true

          # Logs e configs
          cp /tmp/build_optee.log /tmp/artifacts/logs/
          cp /tmp/build_tftf.log  /tmp/artifacts/logs/

          # Versões e commits
          echo "=== COMMITS ===" > /tmp/artifacts/logs/versions.txt
          git -C $GITHUB_WORKSPACE/optee-fvp/optee_os log --oneline -3 >> \
            /tmp/artifacts/logs/versions.txt
          git -C $TFA log --oneline -3 >> \
            /tmp/artifacts/logs/versions.txt
          git -C $TFTF log --oneline -3 >> \
            /tmp/artifacts/logs/versions.txt

          ls -lh /tmp/artifacts/binaries/
          ls -lh /tmp/artifacts/debug/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-binaries
          path: /tmp/artifacts/binaries/
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-debug
          path: /tmp/artifacts/debug/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-logs
          path: /tmp/artifacts/logs/
