name: Build OP-TEE FVP
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            android-tools-adb \
            android-tools-fastboot \
            acpica-tools \
            autoconf \
            automake \
            bc \
            bison \
            build-essential \
            ccache \
            cscope \
            curl \
            device-tree-compiler \
            e2tools \
            expect \
            flex \
            gdisk \
            git \
            libattr1-dev \
            libcap-ng-dev \
            libfdt-dev \
            libftdi-dev \
            libglib2.0-dev \
            libgmp3-dev \
            libgnutls28-dev \
            libhidapi-dev \
            libmpc-dev \
            libncurses5-dev \
            libpixman-1-dev \
            libslirp-dev \
            libssl-dev \
            libtool \
            libusb-1.0-0-dev \
            make \
            mtools \
            netcat \
            ninja-build \
            python3-cryptography \
            python3-pip \
            python3-pyelftools \
            python3-serial \
            python3-tomli \
            python-is-python3 \
            rsync \
            swig \
            unzip \
            uuid-dev \
            wget \
            xdg-utils \
            xsltproc \
            xterm \
            xz-utils \
            zlib1g-dev
      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync OP-TEE Manifest
        run: |
          mkdir -p optee-fvp
          cd optee-fvp
          repo init -u https://github.com/OP-TEE/manifest.git -m fvp.xml
          repo sync -j$(nproc) --no-clone-bundle
      - name: Download official toolchains
        run: |
          cd optee-fvp/build
          make -f fvp.mk toolchains
      - name: Build OP-TEE FVP
        run: |
          cd optee-fvp/build
          make -f fvp.mk all -j$(nproc)
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-build
          path: |
            optee-fvp/trusted-firmware-a/build/fvp/release/bl1.bin
            optee-fvp/trusted-firmware-a/build/fvp/release/fip.bin
            optee-fvp/out/boot-fat.uefi.img
            optee-fvp/out/boot.scr
            optee-fvp/out-br/images/rootfs.cpio.gz
            optee-fvp/linux/arch/arm64/boot/Image
            optee-fvp/linux/arch/arm64/boot/dts/arm/fvp-base-revc.dtb
          if-no-files-found: error
