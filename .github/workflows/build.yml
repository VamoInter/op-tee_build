$(head -109 .github/workflows/build.yml)

      - name: Collect artifacts
        run: |
          mkdir -p /tmp/artifacts/binaries /tmp/artifacts/debug /tmp/artifacts/logs
          WS=$GITHUB_WORKSPACE/optee-fvp
          TFTF=$WS/trusted-firmware-a-tests

          echo "=== Procurando binarios ==="
          find $WS -name "bl1.bin" | grep -v "\.o" | head -5
          find $WS -name "fip.bin" | grep -v "\.o" | head -5
          find $WS -name "boot-fat.uefi.img" | head -3
          find $WS -name "tftf.bin" | head -3

          BL1=$(find $WS -name "bl1.bin" | grep -v "\.o" | head -1)
          FIP=$(find $WS -name "fip.bin" | grep -v "\.o\|tftf" | head -1)
          IMG=$(find $WS -name "boot-fat.uefi.img" | head -1)
          TFTF_BIN=$(find $TFTF -name "tftf.bin" | head -1)

          [ -n "$BL1" ]      && cp $BL1      /tmp/artifacts/binaries/bl1.bin
          [ -n "$FIP" ]      && cp $FIP      /tmp/artifacts/binaries/fip.bin
          [ -n "$IMG" ]      && cp $IMG      /tmp/artifacts/binaries/boot-fat.uefi.img
          [ -n "$TFTF_BIN" ] && cp $TFTF_BIN /tmp/artifacts/binaries/tftf.bin

          find $WS/trusted-firmware-a -name "*.elf" -o -name "*.map" 2>/dev/null | xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true
          find $TFTF/build -name "*.elf" -o -name "*.map" 2>/dev/null | xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true
          find $WS/optee_os -name "tee.elf" 2>/dev/null | xargs -I{} cp {} /tmp/artifacts/debug/ 2>/dev/null || true

          cp /tmp/build_optee.log /tmp/artifacts/logs/ 2>/dev/null || true
          cp /tmp/build_tftf.log  /tmp/artifacts/logs/ 2>/dev/null || true

          echo "=== COMMITS ===" > /tmp/artifacts/logs/versions.txt
          git -C $WS/optee_os log --oneline -3 >> /tmp/artifacts/logs/versions.txt 2>/dev/null || true
          git -C $WS/trusted-firmware-a log --oneline -3 >> /tmp/artifacts/logs/versions.txt 2>/dev/null || true
          git -C $TFTF log --oneline -3 >> /tmp/artifacts/logs/versions.txt 2>/dev/null || true

          echo "=== Resultado ==="
          ls -lh /tmp/artifacts/binaries/
          ls -lh /tmp/artifacts/debug/ | head -20
