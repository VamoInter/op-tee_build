name: Build OP-TEE FVP + TFTF Attack

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            repo git curl wget python3 python3-pip \
            make cmake ninja-build pkg-config \
            libssl-dev libglib2.0-dev libpixman-1-dev \
            device-tree-compiler bc bison flex \
            dosfstools mtools cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache Toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: optee-fvp/toolchains
          key: ${{ runner.os }}-optee-toolchains-v1

      - name: Sync OP-TEE Manifest
        run: |
          mkdir -p optee-fvp
          cd optee-fvp
          repo init -u https://github.com/OP-TEE/manifest.git -m fvp.xml
          repo sync -j$(nproc) --no-clone-bundle

      - name: Download toolchains
        if: steps.cache-toolchains.outputs.cache-hit != 'true'
        run: |
          cd optee-fvp/build
          make -f fvp.mk toolchains

      - name: Build OP-TEE FVP
        run: |
          cd optee-fvp/build
          make -f fvp.mk all \
            SPMC_AT_EL=1 \
            CFG_SECURE_PARTITION=y \
            DEBUG=1 \
            -j$(nproc) \
            2>&1 | tee /tmp/build_optee.log

      - name: Inject test sources into TFTF
        run: |
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests
          FRAG=$TFTF/tftf/tests/runtime_services/secure_service/ffa_frag_mismatch
          TEST_SRC=$GITHUB_WORKSPACE/tftf-tests

          mkdir -p "$FRAG"

          # Injeta o teste do Claude (baseline)
          cp "$TEST_SRC/test_op_tee_oob_claude.c" "$FRAG/"
          cp "$TEST_SRC/tests-op-tee-oob.mk" "$TFTF/tftf/tests/"
          cp "$TEST_SRC/tests-op-tee-oob.xml" "$TFTF/tftf/tests/"

          # Injeta o NOSSO teste (CWE-200 Fingerprint)
          cp "$TEST_SRC/test_op_tee_oob_cwe200.c" "$FRAG/"
          cp "$TEST_SRC/tests-op-tee-oob-cwe200.mk" "$TFTF/tftf/tests/"
          cp "$TEST_SRC/tests-op-tee-oob-cwe200.xml" "$TFTF/tftf/tests/"

          # Registra os testes no build system
          echo "include \${MAKEFILES_PATH}tests-op-tee-oob.mk" >> "$TFTF/tftf/tests/tests_common.mk"
          echo "include \${MAKEFILES_PATH}tests-op-tee-oob-cwe200.mk" >> "$TFTF/tftf/tests/tests_common.mk"

      - name: Build TFTF (CWE-200 Version)
        run: |
          TFTF=$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests
          CROSS=$(ls "$GITHUB_WORKSPACE"/optee-fvp/toolchains/aarch64/bin/aarch64-*-gcc \
                  | head -1 | sed 's/gcc$//')

          cd "$TFTF"
          make \
            CROSS_COMPILE="$CROSS" \
            PLAT=fvp \
            DEBUG=1 \
            TESTS=op-tee-oob-cwe200 \
            -j$(nproc) \
            2>&1 | tee /tmp/build_tftf.log

      - name: Rebuild TF-A FIP with TFTF as BL33
        run: |
          TFTF="$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a-tests/build/fvp/debug/tftf.bin"
          TFA="$GITHUB_WORKSPACE/optee-fvp/trusted-firmware-a"

          CROSS=$(find "$GITHUB_WORKSPACE/optee-fvp/toolchains/aarch64/bin" \
            -type f -name 'aarch64-*-gcc' \
            -print -quit | sed 's/gcc$//')

          cd "$TFA"
          make \
            CROSS_COMPILE="$CROSS" \
            PLAT=fvp \
            DEBUG=1 \
            BL33="$TFTF" \
            fip \
            2>&1 | tee /tmp/build_fip_tftf.log

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-binaries
          path: |
            optee-fvp/trusted-firmware-a/build/fvp/debug/bl1.bin
            optee-fvp/trusted-firmware-a/build/fvp/debug/bl2.bin
            optee-fvp/trusted-firmware-a/build/fvp/debug/bl31.bin
            optee-fvp/trusted-firmware-a/build/fvp/debug/fip.bin
            optee-fvp/trusted-firmware-a-tests/build/fvp/debug/tftf.bin
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optee-fvp-logs
          path: |
            /tmp/build_optee.log
            /tmp/build_tftf.log
            /tmp/build_fip_tftf.log
          if-no-files-found: warn
